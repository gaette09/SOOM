</script><script>(function(){
'use strict';
const art=document.getElementById('art');
let state={id:'idle',playing:false,loop:true,speed:1,position:0,revision:-1,active:false,reduced:false};
let time=0,raf=null,last=null,lastDraw=-Infinity,draws=0,colorEffort=null;
const duration=()=>SOOM.clips.find(c=>c.id===state.id).duration;
function draw(){
 let controls=null;
 if(Number.isFinite(state.effort)){
  controls={...SOOM.effortControls(state.effort,time,state.reduced,state.aboveUsual),colorEffort};
 }
 art.innerHTML=SOOM.svg(state.id,time,state.reduced,controls);draws++;
}
function cancel(){if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;lastDraw=-Infinity;}
function allowed(){return state.active&&state.playing&&!state.reduced&&!document.hidden;}
function start(){if(allowed()&&raf===null)raf=requestAnimationFrame(tick);}
function tick(now){raf=null;if(!allowed()){last=null;return;}
 if(last!==null){
  const dt=Math.max(0,Math.min(.1,(now-last)/1000));
  time+=(now-last)/1000*state.speed;
  // Ease color by elapsed time, independently of breathing speed. Never reset
  // the motion clock or alternate through the default palette during dragging.
  if(Number.isFinite(state.effort))colorEffort+=(state.effort-colorEffort)*(1-Math.exp(-dt/.16));
 }
 last=now;
 if(time>=duration()){
  if(state.loop)time%=duration();
  else{time=duration();state.playing=false;draw();last=null;
   window.webkit?.messageHandlers?.soomCharacter?.postMessage({event:'ended',id:state.id,revision:state.revision});return;}
 }
 if(now-lastDraw>=1000/30-.2){draw();lastDraw=now;}
 start();
}
window.SoomCharacterRuntime={
 configure(next){
  if(!SOOM.clips.some(c=>c.id===next.id))return;
  const reset=next.revision!==state.revision||next.id!==state.id;
  state={...state,...next};
  if(reset){cancel();time=Math.max(0,Math.min(duration(),state.position));}
  if(!Number.isFinite(state.effort))colorEffort=null;
  else if(!Number.isFinite(colorEffort)||!allowed())colorEffort=state.effort;
  draw();if(!allowed())cancel();else start();
 },
 inspect(){return {...state,time,colorEffort,scheduled:raf!==null,draws};},
 dispose(){state.active=false;cancel();}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();else start();});
draw();
})();
